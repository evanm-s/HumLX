[workspace]
resolver = "2"
members = ["crates/humlx-core", "src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
