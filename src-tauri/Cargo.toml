[package]
name = "humlx"
description = "Touch-first DMX lighting control over Art-Net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "humlx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
humlx-core = { path = "../crates/humlx-core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Same HTTP stack the updater uses, to explain failed update checks.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-process = "2"
rusb = { version = "0.9.4", features = ["vendored"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["net", "sync", "macros", "rt"] }
getrandom = "0.3"
if-addrs = "0.13"
