name: Release

# Bump the version in src-tauri/tauri.conf.json on main and this publishes
# v<version> with signed installers. Pushing a v* tag by hand still works too.
# The installed app finds the release through latest.json and offers to update.
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version needs a release
        id: check
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          state="$(gh release view "v$version" --json isDraft,assets --jq '[.isDraft, (.assets | map(.name) | index("latest.json") != null)] | @tsv' 2>/dev/null || echo missing)"
          if [ "$GITHUB_REF_TYPE" != tag ] && printf '%s' "$state" | grep -q $'\ttrue$'; then
            echo "v$version is already released, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create a draft release
        id: draft
        if: steps.check.outputs.publish == 'true'
        shell: bash
        run: |
          tag="v${{ steps.check.outputs.version }}"
          # Take the id straight from the create response: a just-made draft
          # can be missing from the release list for a few seconds.
          if id="$(gh release view "$tag" --json databaseId --jq .databaseId 2>/dev/null)" && [ -n "$id" ]; then
            echo "Using the existing $tag release."
          else
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -F draft=true \
              -f name="HumLX $tag" \
              -f body="Install on a new computer with the Windows installer below. Computers that already have HumLX offer the update themselves." \
              --jq .id)"
          fi
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Stamp the release version
        shell: bash
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "${{ needs.prepare.outputs.version }}"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: HumLX v${{ needs.prepare.outputs.version }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Publishing creates the tag. The release stays a draft until every
      # installer and latest.json is attached, so the app never sees half a release.
      - run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -F draft=false -f make_latest=true --jq .html_url
